<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Control</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src ws://127.0.0.1:*">
<link rel="stylesheet" href="inspector.css"></head><body>
<h1>Home Control</h1><p>このボタンで操作する電球を選びます。</p>
<div class="tools"><button id="reload">一覧を更新</button><button id="settings">接続設定を開く</button></div>
<fieldset><legend>電球（複数選択で一括操作）</legend><div id="devices">接続中…</div></fieldset>
<label for="action">操作</label><select id="action"><option value="toggle">オン／オフ切り替え</option><option value="on">オン</option><option value="off">オフ</option><option value="brightness">明るさ</option><option value="temperature">色温度</option><option value="color">色</option></select>
<div id="numberRow" hidden><label id="numberLabel" for="value">値</label><input id="value" type="number" step="1"></div>
<div id="colorRow" hidden><label for="color">色</label><input id="color" type="color" value="#ffffff"></div>
<p class="hint">変更は自動保存します。切り替えは選択した各電球の状態を反転します。</p>
<button id="status">状態を確認</button><p class="hint">黄：全台オン／灰：全台オフ／青：未確認・混在。状態は操作後と手動確認時に更新します。</p>
<pre id="message" role="status" aria-live="polite">Home Controlに接続しています…</pre>
<script src="inspector.js"></script></body></html>
